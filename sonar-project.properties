sonar.projectKey=storytold_soundcraft
sonar.organization=storytold

# The locale catalogs are one table of string-literal rows per language; Sonar's copy-paste
# detection reads runs of those rows as copies of each other. That repetition is data, not
# copy-pasted logic, so they are left out of duplication only and analysed for everything else (#1630).
sonar.cpd.exclusions=crates/ui-egui/locales/**
# Packaging verification scripts are standalone test suites, not covered by Rust coverage reports.
sonar.coverage.exclusions=packaging/**
