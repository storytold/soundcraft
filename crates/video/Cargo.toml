[package]
name = "soundcraft-video"
description = "SoundCraft video: MP4/MOV demux, H.264 / ProRes / Motion JPEG decoding to RGBA, timeline thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Frame-parallel H.264 and slice-parallel ProRes decoding (rayon). Off by default: SoundCraft
# decodes on its own background thread and only needs one picture at a time.
threads = ["dep:rayon"]

[dependencies]
craft-media.workspace = true
thiserror.workspace = true
serde.workspace = true
image = { workspace = true, features = ["jpeg"] }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
