[package]
name = "soundcraft-ui-egui"
description = "SoundCraft's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true

[dependencies]
craft-mime.workspace = true
craft-ui = { workspace = true, features = ["cloud"] }
# Entries, capabilities and the other vendor-neutral types `craft_ui::cloud` and `craft_ui::share`
# carry; no provider implements it in this repository.
craft-cloud.workspace = true
soundcraft-time.workspace = true
craft-audio.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-au-host.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-engine.workspace = true
soundcraft-playback.workspace = true
soundcraft-video.workspace = true
# 0.37 makes the bundled faces opt-in; the app's own font loader starts from
# `FontDefinitions::default()`, and kittest never supplies fonts to this root.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
web-time.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# The reference `CloudBackend` the cloud module's tests connect, proving the pages work against a
# real, working implementation of the contract rather than a bespoke test double.
craft-cloud-local.workspace = true
tempfile = "3"

[lints]
workspace = true

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
