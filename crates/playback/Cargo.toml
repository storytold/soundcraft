[package]
name = "soundcraft-playback"
description = "SoundCraft audio and MIDI device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
# Only to ask whether libjack can be loaded before cpal's JACK host is touched (see host.rs).
jack-sys = { version = "0.5", optional = true }
# To wire the JACK host's streams to a chosen interface (see jack_ports.rs); cpal's own version.
jack = { version = "0.13", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

# MIDI devices (ALSA sequencer, CoreMIDI, WinMM). Elsewhere there is no MIDI input (midi.rs).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
midir.workspace = true

[features]
# Extra audio hosts next to the system one (see docs/releasing.md, "Audio libraries"). None is on
# by default here; the desktop app (apps/soundcraft) turns `jack` and `pipewire` on by default and
# leaves `asio` opt-in: cargo run -p soundcraft --features asio
# JACK: on Linux the build needs the JACK headers (jack.pc); everywhere libjack is loaded at
# runtime when present.
jack = ["cpal/jack", "dep:jack-sys", "dep:jack"]
# PipeWire (Linux): needs the PipeWire headers and libclang, and links libpipewire-0.3.
pipewire = ["cpal/pipewire"]
# ASIO (Windows): needs LLVM/Clang and the Steinberg ASIO SDK (downloaded by the build, or
# CPAL_ASIO_DIR). The SDK has its own licence: read it before distributing such a build.
asio = ["cpal/asio"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
