[package]
name = "soundcraft"
description = "SoundCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundcraft"

[lints]
workspace = true

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[features]
# JACK and PipeWire are built in by default, so Linux builds need their headers and libclang
# (docs/releasing.md, "Audio libraries"); `--no-default-features` gives the system host only
# (ALSA on Linux). Off Linux `pipewire` does nothing and `jack` has no build dependency.
default = ["jack", "pipewire"]
# Extra audio hosts (see crates/playback/Cargo.toml).
jack = ["soundcraft-playback/jack"]
pipewire = ["soundcraft-playback/pipewire"]
asio = ["soundcraft-playback/asio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for soundcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
