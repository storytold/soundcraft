# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: soundcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: sound
priority: optional
maintainer: ${SOUNDCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://getartcraft.com/apps/soundcraft
license: MIT OR Apache-2.0
description: |-
  Open-source, native digital audio workstation. Record, edit and mix
  multitrack audio and MIDI in Edit and Mix windows; built-in EQ, dynamics,
  reverb, delay and instruments; imports WAV, AIFF, FLAC, MP3 and MIDI.
  Includes soundcraft-cli, a headless editor, bounce tool and MCP server.

# The app links glibc, libgcc_s and ALSA (libasound, for audio I/O through cpal; PulseAudio and
# PipeWire are reached through their ALSA plugins). Windowing (X11/Wayland, xkbcommon) and the GPU
# (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here rather
# than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libasound2 | libasound2t64
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - pipewire-alsa | pulseaudio
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE (which has no libxkbcommon, vulkan-loader or libglvnd-egl package). The glibc
    # floor names libm because the binaries' GLIBC_2.35 symbols (hypot, hypotf) are libm's: RHEL 9's
    # glibc 2.34 provides libc.so.6(GLIBC_2.35) through backports, but not this, so it refuses.
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
      - libasound.so.2()(64bit)
    # The windowing libraries by soname too, so the recommendations resolve on openSUSE as well.
    recommends:
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - (pipewire-alsa or alsa-plugins-pulseaudio)

contents:
  - src: ${STAGE}/usr/bin/soundcraft
    dst: /usr/bin/soundcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/soundcraft-cli
    dst: /usr/bin/soundcraft-cli
    file_info: { mode: 0755 }
  # Named one by one rather than as a tree of /usr/share: a tree would also own shared directories
  # such as /usr/share/mime, which openSUSE's filesystem package owns with other modes, and RPM
  # refuses to install a package that conflicts with it.
  - src: ${STAGE}/usr/share/applications/ai.storyteller.soundcraft.desktop
    dst: /usr/share/applications/ai.storyteller.soundcraft.desktop
  - src: ${STAGE}/usr/share/mime/packages/ai.storyteller.soundcraft.xml
    dst: /usr/share/mime/packages/ai.storyteller.soundcraft.xml
  - src: ${STAGE}/usr/share/metainfo/ai.storyteller.soundcraft.metainfo.xml
    dst: /usr/share/metainfo/ai.storyteller.soundcraft.metainfo.xml
  - src: ${STAGE}/usr/share/icons/hicolor/
    dst: /usr/share/icons/hicolor/
    type: tree
  - src: ${STAGE}/usr/share/doc/soundcraft/
    dst: /usr/share/doc/soundcraft/
    type: tree
  # cli-docs:begin. soundcraft-cli's man pages and completions. When package.sh leaves them out it deletes
  # this block, through the end marker below: nfpm refuses an entry whose file is missing.
  - src: ${STAGE}/usr/share/man/man1/*.1
    dst: /usr/share/man/man1/
  - src: ${STAGE}/usr/share/bash-completion/completions/soundcraft-cli
    dst: /usr/share/bash-completion/completions/soundcraft-cli
  - src: ${STAGE}/usr/share/zsh/site-functions/_soundcraft-cli
    dst: /usr/share/zsh/site-functions/_soundcraft-cli
  - src: ${STAGE}/usr/share/fish/vendor_completions.d/soundcraft-cli.fish
    dst: /usr/share/fish/vendor_completions.d/soundcraft-cli.fish
  # cli-docs:end
  # Debian's zsh reads vendor-completions, not /usr/share/zsh/site-functions as Fedora's and
  # openSUSE's do (its debian/rules sets --enable-additional-fpath).
  - src: /usr/share/zsh/site-functions/_soundcraft-cli
    dst: /usr/share/zsh/vendor-completions/_soundcraft-cli
    type: symlink
    packager: deb

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
